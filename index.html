<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#101114">
  <title>RICOS · 3D VIEWER</title>
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./src/style.css?v=dark-v1">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
    }
  }
  </script>
  <link rel="modulepreload" href="./src/viewer-core.js">
  <script type="module" src="./src/main.js?v=dark-v2"></script>
</head>
<body>
  <main class="shell">
    <header class="topbar" aria-label="Controles y modelos">
      <span class="top-brand" aria-label="Ricos 3D Viewer">RICOS<span class="brand-suffix">/ 3D</span></span>
      <button type="button" class="load-button" id="loadButton">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M12 4v16M4 12h16"/></svg>
        Cargar modelo local
      </button>
      <input id="fileInput" type="file" accept=".glb,.obj,.stl" hidden>
      <nav class="model-list" id="modelList" aria-label="Modelos guardados"></nav>
      <span id="modelCounter" class="counter" aria-label="Número de modelos">00</span>
      <button id="saveButton" type="button" class="save-button" title="Guardar modelo en GitHub" aria-label="Guardar modelo en GitHub" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M12 16V4m-4 4 4-4 4 4M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>
        <span>Guardar</span>
      </button>
    </header>
    <section class="view" id="view" aria-label="Visor 3D">
      <div id="viewport" class="viewport"></div>
      <div id="busy" class="busy" role="status" aria-label="Cargando modelo" hidden>
        <div class="loader"></div>
      </div>
    </section>
  </main>

  <dialog id="publishDialog" class="publish-dialog">
    <form id="publishForm" class="publish-form">
      <button type="button" class="modal-close" id="closeDialog" aria-label="Cerrar">×</button>
      <div class="modal-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 16V4m-4 4 4-4 4 4M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>
      </div>
      <h1>Guardar en GitHub</h1>
      <p id="fileInfo"></p>
      <label for="modelName">Nombre del modelo</label>
      <input id="modelName" type="text" maxlength="80" required autocomplete="off">
      <label for="accessToken">Token de GitHub</label>
      <input id="accessToken" type="password" required autocomplete="off" spellcheck="false" placeholder="github_pat_…">
      <p class="token-hint">Usá un token temporal, limitado a este repositorio, con permiso <strong>Contents: Read and write</strong>. No se guarda en el sitio ni en el navegador.</p>
      <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener noreferrer" class="token-link">Crear token de acceso ↗</a>
      <p id="publishError" class="publish-error" role="alert" hidden></p>
      <button class="confirm-button" id="confirmPublish" type="submit">Guardar modelo</button>
    </form>
  </dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
