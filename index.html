<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f7f7f5">
  <title>RICOS · 3D VIEWER</title>
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./src/style.css?v=fix-2">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="./src/main.js?v=fix-2"></script>
</head>
<body>
  <main class="shell">
    <aside class="library" aria-label="Biblioteca de modelos guardados">
      <div class="library-top">
        <div class="brand" aria-label="RICOS 3D">
          <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linejoin="round" aria-hidden="true">
            <path d="M16 3 28 10v13L16 30 4 23V10L16 3Z" />
            <path d="M4 10 16 17l12-7M16 17v13" />
          </svg>
        </div>
        <button type="button" class="load-button" id="loadButton">Cargar modelo local</button>
        <input id="fileInput" type="file" accept=".glb,.obj,.stl" hidden>
      </div>
      <div id="modelList" class="model-list" aria-live="polite"></div>
      <div class="library-bottom"><span id="modelCounter" aria-label="Cantidad de modelos">00</span></div>
    </aside>
    <section class="view" id="view" aria-label="Visor 3D">
      <div id="viewport" class="viewport"></div>
      <div class="center-mark" id="centerMark" aria-hidden="true">
        <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M32 7 54 19.5v25L32 57 10 44.5v-25L32 7Z"/><path d="M10 19.5 32 32l22-12.5M32 32v25"/></svg>
      </div>
      <div id="busy" class="busy" role="status" aria-live="polite" hidden><div class="loader"></div></div>
      <button id="saveButton" type="button" class="save-button" title="Guardar modelo en GitHub" aria-label="Guardar modelo en GitHub" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 16V4m-4 4 4-4 4 4M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/>
        </svg>
      </button>
      <div class="control-hint" id="controlHint" aria-hidden="true"></div>
    </section>
  </main>

  <dialog id="publishDialog" class="publish-dialog">
    <form id="publishForm" class="publish-form">
      <button type="button" class="modal-close" id="closeDialog" aria-label="Cerrar">×</button>
      <div class="modal-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 16V4m-4 4 4-4 4 4M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>
      </div>
      <h1>Guardar en GitHub</h1>
      <p id="fileInfo"></p>
      <label for="modelName">Nombre del modelo</label>
      <input id="modelName" type="text" maxlength="80" required autocomplete="off">
      <label for="accessToken">Token de GitHub</label>
      <input id="accessToken" type="password" required autocomplete="off" spellcheck="false" placeholder="github_pat_…">
      <p class="token-hint">Usá un token temporal, limitado a este repositorio, con permiso <strong>Contents: Read and write</strong>. No se guarda en el sitio ni en el navegador.</p>
      <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener noreferrer" class="token-link">Crear token de acceso ↗</a>
      <p id="publishError" class="publish-error" role="alert" hidden></p>
      <button class="confirm-button" id="confirmPublish" type="submit">Guardar modelo</button>
    </form>
  </dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
